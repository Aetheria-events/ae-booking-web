name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vite.config.js reads GITHUB_REPOSITORY, so the build is emitted with
      # the /Aetheria/ prefix that a project page needs.
      # SITE_URL keeps the sitemap pointing at this exact copy, path prefix and
      # all, instead of at the custom domain the site is headed for.
      - name: Build site
        env:
          SITE_URL: https://tapasul.github.io/Aetheria
        run: npm run build

      # GitHub Pages has no SPA fallback. Serving index.html for unknown paths
      # (as 404.html) lets /Aetheria/booking and friends boot the router
      # instead of showing Pages' own 404 page.
      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
