name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vite.config.js reads GITHUB_REPOSITORY, so the build is emitted with the
      # prefix a project page needs (and with no prefix at all when the repo is
      # an org or user site named <owner>.github.io).
      #
      # SITE_URL keeps the sitemap and robots.txt pointing at this exact copy,
      # path prefix and all, instead of at the custom domain the site is headed
      # for. It is worked out from the repository that runs the job, so moving
      # the site to another owner or account needs no edit here.
      - name: Work out the addresses
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          owner="${owner,,}"
          if [[ "$repo" == *.github.io ]]; then
            echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${owner}.github.io/${repo}" >> "$GITHUB_ENV"
          fi

      - name: Build site
        run: |
          echo "building for $SITE_URL"
          npm run build

      # GitHub Pages has no SPA fallback. Serving index.html for unknown paths
      # (as 404.html) lets /booking and friends boot the router
      # instead of showing Pages' own 404 page.
      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
